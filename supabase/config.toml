# Configuração do CLI do Supabase.
#
# Este arquivo existe por UM motivo, e ele é grave o bastante para ficar no
# topo: o CLI publica toda função com verificação de JWT LIGADA por padrão.
#
# O asaas-webhook é chamado pelo Asaas, que não manda token nenhum. Publicá-lo
# com JWT ligado faz o Asaas levar 401 em toda notificação de pagamento — e o
# estrago é silencioso: o site continua no ar, o paciente continua pagando, e os
# agendamentos simplesmente param de ser confirmados. Ninguém vê erro nenhum.
#
# OS VALORES ABAIXO FORAM LIDOS DA PRODUÇÃO, não deduzidos. A primeira versão
# deste arquivo foi escrita no chute, marcando `true` em tudo que "parecia"
# precisar de token, e cinco funções estavam com `false` no ar — publicar
# qualquer uma delas teria causado exatamente a falha que este arquivo existe
# para evitar. Se for acrescentar função nova aqui, confira antes com:
#
#   npx supabase functions list --project-ref fnzvopspcoefzybtmwlg

project_id = "fnzvopspcoefzybtmwlg"

# ─── Sem JWT: quem chama é serviço externo ou cron, sem token de usuário ──────

[functions.asaas-webhook]
# A segurança aqui não vem de JWT: a função CONFERE a cobrança direto na API do
# Asaas antes de agir, então um POST forjado não passa. Ver o comentário no topo
# de functions/asaas-webhook/index.ts.
verify_jwt = false

[functions.reconcile-asaas]
verify_jwt = false

[functions.send-appointment-email]
verify_jwt = false

[functions.send-doctor-invite]
verify_jwt = false

[functions.record-legal-consent]
verify_jwt = false

[functions.social-publish]
verify_jwt = false

[functions.livekit-webhook]
verify_jwt = false

[functions.check-expired-offers]
verify_jwt = false

# ─── Com JWT ─────────────────────────────────────────────────────────────────

[functions.notify-doctor-new-appointment]
# Além do JWT, a função confere se é a service role — sem isso, qualquer usuário
# logado dispararia WhatsApp pago para médicos.
verify_jwt = true

[functions.create-asaas-payment]
verify_jwt = true

[functions.refund-asaas-payment]
verify_jwt = true

[functions.generate-jaas-token]
verify_jwt = true

[functions.jaas-token]
verify_jwt = true
