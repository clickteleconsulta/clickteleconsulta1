<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://meet.jit.si https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://challenges.cloudflare.com;
      connect-src 'self' https://meet.jit.si wss://meet.jit.si https://*.jitsi.net wss://*.jitsi.net https://*.supabase.co wss://*.supabase.co https://api.avidoc.com.br wss://api.avidoc.com.br https://*.hostinger.com https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://connect.facebook.net https://www.facebook.com https://challenges.cloudflare.com;
      img-src 'self' data: blob: https:;
      style-src 'self' 'unsafe-inline' https://meet.jit.si;
      font-src 'self' data: https:;
      frame-src 'self' https://meet.jit.si https://challenges.cloudflare.com;
      media-src 'self' blob: https:;
      worker-src 'self' blob:;
    ">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- A fonte da marca é servida do próprio domínio (ver src/index.css). Sem
         preconnect ao Google: não há mais o que buscar lá. O preload evita que o
         texto pisque na fonte do sistema antes da Geist chegar — o @font-face
         mora no CSS, que o navegador só lê depois de baixar o bundle. -->
    <link rel="preload" href="/fonts/geist-variable.woff2" as="font" type="font/woff2" crossorigin>
    <!-- A Gabarito é só do logo, mas o logo está no topo de toda página e o
         @font-face dela usa `font-display: block` — sem o preload a marca
         ficaria em branco até o CSS ser lido. São 1,1 KB. -->
    <link rel="preload" href="/fonts/gabarito-logo.woff2" as="font" type="font/woff2" crossorigin>

    <!-- SEO (padrões da marca; páginas ajustam título/descrição via react-helmet) -->
    <meta name="google-site-verification" content="%VITE_GSC_VERIFICATION%" />
    <title>aviDoc — Agende sua teleconsulta online</title>
    <meta name="description" content="Marketplace de agendamento de teleconsultas: escolha um médico, agende e seja atendido online, de onde estiver. A partir de R$ 40, com Pix ou cartão e sem mensalidade." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#3B5BA5" />
    <meta name="author" content="CLICK TELECONSULTA ONLINE LTDA" />

    <!-- Open Graph (preview de link no WhatsApp, Facebook, etc.) -->
    <meta property="og:site_name" content="aviDoc" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="aviDoc — Agende sua teleconsulta online" />
    <meta property="og:description" content="Escolha um médico, agende e seja atendido online. A partir de R$ 40, com Pix ou cartão, sem mensalidade." />
    <meta property="og:url" content="https://avidoc.com.br/" />
    <!-- URL VERSIONADA, de propósito. WhatsApp, Facebook, LinkedIn e X guardam a
         prévia POR URL: trocar o conteúdo do arquivo sem trocar o endereço não
         adianta — eles seguem servindo a imagem que rasparam antes, por dias.
         Ao regerar a arte, suba o número (v3, v4…) e atualize as quatro
         referências abaixo; é isso que obriga a releitura. -->
    <meta property="og:image" content="https://avidoc.com.br/og-image-v3.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Agende sua consulta médica online, a partir de R$ 40,00 — aviDoc" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="aviDoc — Agende sua teleconsulta online" />
    <meta name="twitter:description" content="Escolha um médico, agende e seja atendido online. A partir de R$ 40, sem mensalidade." />
    <meta name="twitter:image" content="https://avidoc.com.br/og-image-v3.png" />

    <!-- Dados estruturados: Organização (marketplace/intermediador — NÃO provedor médico) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "aviDoc",
      "legalName": "CLICK TELECONSULTA ONLINE LTDA",
      "url": "https://avidoc.com.br",
      "logo": "https://avidoc.com.br/marca/logo.png",
      "image": "https://avidoc.com.br/og-image-v3.png",
      "description": "Marketplace de agendamento de teleconsultas que conecta pacientes a médicos parceiros. A responsabilidade pelo atendimento é do profissional; a plataforma intermedia o agendamento e o pagamento.",
      "email": "contato@avidoc.com.br",
      "taxID": "68.171.336/0001-50",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "R. Antônio Pereira Ramos, 118, Centro",
        "addressLocality": "Coroaci",
        "addressRegion": "MG",
        "postalCode": "39710-000",
        "addressCountry": "BR"
      },
      "areaServed": "BR",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "contato@avidoc.com.br",
        "contactType": "customer support",
        "availableLanguage": "Portuguese"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
